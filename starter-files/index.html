<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030403" />
    <meta
      name="description"
      content="Easy Fancy — a four-chapter, scroll-driven landing page drawn live in the browser."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Easy Fancy — a scroll-driven studio</title>
    <script>
      // The virtual dev server appends React Refresh registrations to modules.
      // On a cold load the first module can evaluate before the refresh runtime
      // publishes its globals, which would blank the page. Start with no-ops;
      // the runtime replaces them as soon as it initialises.
      window.$RefreshReg$ ||= () => {};
      window.$RefreshSig$ ||= () => (type) => type;
    </script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0?dev",
          "react/": "https://esm.sh/react@18.2.0&dev/",
          "react-dom": "https://esm.sh/react-dom@18.2.0?dev",
          "react-dom/": "https://esm.sh/react-dom@18.2.0&dev/",
          "react-router-dom": "https://esm.sh/react-router-dom@7.18.4?external=react,react-dom",
          "react-router": "https://esm.sh/react-router@7.18.4?external=react,react-dom",
          "@tailwindcss/browser": "https://esm.sh/@tailwindcss/browser@4.3.3",
          "zustand": "https://esm.sh/zustand@5.0.16?external=react",
          "three": "https://esm.sh/three@0.186.1/webgpu",
          "three/": "https://esm.sh/three@0.186.1/",
          "three/webgpu": "https://esm.sh/three@0.186.1/webgpu",
          "three/tsl": "https://esm.sh/three@0.186.1/tsl",
          "three/addons/": "https://esm.sh/three@0.186.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
