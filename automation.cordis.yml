# Project-local launch overlay for the DeepSeek Harness SDK runtime.
#
# The `sdk` profile already composes dsh-base + dsh-sdk-app. This file is the
# project's own patch layer, passed to DeepSeekHarness via
# `patches: ['./automation.cordis.yml']`. Rows are addressed by id and the last
# write wins, so add overrides here rather than editing installed packages.
#
# Empty on purpose: Forge currently uses the shipped SDK composition unchanged.

